[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changan-revival-stub"
version = "0.1.0"
description = "Unofficial fan-made compatibility server for the CN 0.1.20.1 client (preview)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (original code only; see LICENSE and NOTICE)" }
authors = [{ name = "changan-huanshihui-revival contributors" }]
keywords = ["changan", "private-server", "compatibility", "reverse-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/emperor-tianqi/changan-huanshihui-revival-open"

[tool.setuptools]
packages = ["revival_stub"]

[tool.setuptools.package-data]
revival_stub = ["refine_pool.json", "data/*.csv"]
